openapi: 3.0.3
info:
  title: Full Fixture API
  version: 0.1.0
  description: REST API for the full-fixture application.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
  /users:
    get:
      summary: List users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /privacy/export/{user_id}:
    post:
      summary: Export all personal data for a user (GDPR)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Personal data export
  /privacy/delete/{user_id}:
    post:
      summary: Delete all personal data for a user (GDPR)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deletion confirmation
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
