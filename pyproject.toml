[project]
name = "full-fixture-workspace"
version = "0.1.0"
description = "Dummy full-stack monorepo for Agent Readiness testing"
requires-python = ">=3.12"

dependencies = ["api", "worker"]

[tool.uv.workspace]
members = ["packages/api", "packages/worker"]

[tool.uv.sources]
api = { workspace = true }
worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "faker>=25.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "py-spy>=0.3.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"packages/api/src/api/main.py" = ["B008"]  # FastAPI Depends() in defaults is the documented pattern

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_packages = ["api", "worker"]

[[tool.importlinter.contracts]]
name = "API must not import Worker internals"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["worker"]

[[tool.importlinter.contracts]]
name = "Worker may import API public modules only"
type = "forbidden"
source_modules = ["worker"]
forbidden_modules = ["api.main", "api.privacy"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/api/tests", "packages/worker/tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 70
